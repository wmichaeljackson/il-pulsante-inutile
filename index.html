<!DOCTYPE html><html lang='it'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Il Pulsante Inutile</title><style>
body{margin:0;background:#222;color:#fff;font-family:Comic Sans MS,cursive;text-align:center;overflow:hidden}
.page{display:none}.show{display:block}h1{color:#ffd54f}
.big{width:180px;height:180px;border-radius:50%;border:none;font-size:24px;font-weight:bold;margin:20px;cursor:pointer}
#play{background:#ff4081;color:#fff}#comm{background:#4caf50;color:#fff}#home{background:#03a9f4;color:#fff}
#back{position:fixed;left:10px;top:10px;font-size:28px;background:none;border:none;color:white;display:none;cursor:pointer}
#b{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:18px 30px;border-radius:15px}
</style></head><body>
<div id='homePage' class='page show'><h1>🎮 Il Pulsante Inutile</h1>
<button class='big' id='play' onclick='start()'>Gioca</button>
<button class='big' id='comm' onclick="window.open('https://github.com/wmichaeljackson/il-pulsante-inutile/discussions/1','_blank')">Commenti</button><br>
<button id='home' class='big' style='width:140px;height:140px' onclick="location.href='https://wmichaeljackson.github.io/fun.games/'">🎮<br>fun.games</button></div>
<div id='game' class='page'><button id='back' onclick='goHome()'>⬅️</button><h1>🎮 Il Pulsante Inutile</h1><div>Clic: <span id='c'>0</span></div><div id='badge'></div><button id='b'>Non premermi!</button></div>
<script>
function start(){homePage.classList.remove('show');game.classList.add('show');back.style.display='block'}
function goHome(){game.classList.remove('show');homePage.classList.add('show');back.style.display='none'}
const b=document.getElementById('b'),c=document.getElementById('c'),badge=document.getElementById('badge');let n=0;const t=['Non premermi!','Ancora tu?','Basta!','Ci riprovi?','Non mi prenderai!','😂'];
b.tabIndex=-1;b.blur();
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&document.activeElement===b){e.preventDefault();}});
b.onclick=()=>{n++;c.textContent=n;b.textContent=t[Math.floor(Math.random()*t.length)];b.style.left=Math.random()*80+10+'%';b.style.top=Math.random()*70+15+'%';b.style.background='hsl('+Math.random()*360+',80%,60%)';b.style.fontSize=(18+Math.random()*18)+'px';b.style.padding=(14+Math.random()*14)+'px '+(22+Math.random()*20)+'px';if(n==10)badge.textContent='🏆 Testardo';if(n==50)badge.textContent='🏆 Professionista del nulla';if(n==100)badge.textContent='🏆 Ma hai davvero tutto questo tempo?';if(n==500){badge.textContent='👑 Leggenda del pulsante inutile';alert('🎉 Complimenti! Hai vinto... assolutamente niente!');}}
</script></body></html>
