<!DOCTYPE html><html lang='it'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Il Pulsante Inutile</title>
<style>
body{margin:0;background:#222;font-family:Comic Sans MS,cursive;color:#fff;text-align:center;overflow:hidden}
h1{color:#ffd54f;margin-top:30px}#b{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);padding:18px 30px;font-size:22px;border:none;border-radius:15px;cursor:pointer}
#info{margin-top:120px;font-size:24px}#badge{margin-top:20px;color:#7CFC00}
</style></head><body>
<h1>🎮 Il Pulsante Inutile</h1><div id='info'>Clic: <span id='c'>0</span></div><div id='badge'></div>
<button id='b'>Non premermi!</button>
<script>
const b=document.getElementById('b'),c=document.getElementById('c'),badge=document.getElementById('badge');
let n=0;
const txt=["Non premermi!","Ancora tu?","Basta!","Ci riprovi?","Non mi prenderai!","😂"];
b.onclick=()=>{
n++;c.textContent=n;
b.textContent=txt[Math.floor(Math.random()*txt.length)];
b.style.background='hsl('+Math.random()*360+',80%,60%)';
b.style.left=Math.random()*80+10+'%';
b.style.top=Math.random()*70+15+'%';
b.style.fontSize=(18+Math.random()*18)+'px';
if(n==10)badge.textContent='🏆 Testardo';
if(n==50)badge.textContent='🏆 Professionista del nulla';
if(n==100)badge.textContent='🏆 Ma hai davvero tutto questo tempo?';
if(n==500){alert('🎉 Complimenti! Hai vinto... assolutamente niente!');badge.textContent='👑 Leggenda del pulsante inutile';}
}
</script></body></html>
